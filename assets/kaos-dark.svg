<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">KAOS — my personal AI system</title>
  <desc id="d">KAOS, my personal AI system: one self-hosted assistant with a shared memory, a model of itself and the world, a voice in its own panel and on WhatsApp, a brain that thinks with Claude and hands that run jobs on a VPS. 413 commits in the last 12 months.</desc>
  <style>
    .sans{font-family:'General Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .num{font-variant-numeric:tabular-nums}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="479" rx="24" fill="#121212" stroke="#262626"/>
  <text x="61" y="152" class="sans" font-size="76" fill="#FAFAFA" font-weight="700" letter-spacing="-2">KAOS</text>
  <text x="64" y="198" class="sans" font-size="24" fill="#A3A3A3">My personal AI system.</text>
  <text x="64" y="232" class="sans" font-size="24" fill="#A3A3A3">One assistant, self-hosted.</text>
  <text x="62" y="384" class="sans num" font-size="64" fill="#EF4444" font-weight="700" letter-spacing="-2">413</text>
  <text x="64" y="418" class="sans" font-size="18" fill="#A3A3A3">commits in the last 12 months</text>
  <line x1="830" y1="246" x2="830.0" y2="96.0" stroke="#262626" stroke-width="1.5"/>
  <line x1="830" y1="246" x2="1029.72" y2="199.65" stroke="#262626" stroke-width="1.5"/>
  <line x1="830" y1="246" x2="953.43" y2="367.35" stroke="#262626" stroke-width="1.5"/>
  <line x1="830" y1="246" x2="706.57" y2="367.35" stroke="#262626" stroke-width="1.5"/>
  <line x1="830" y1="246" x2="630.28" y2="199.65" stroke="#262626" stroke-width="1.5"/>
  <circle class="pulse" cx="830" cy="246" r="52" fill="none" stroke="#EF4444" stroke-width="2"/>
  <circle cx="830" cy="246" r="52" fill="#121212" stroke="#EF4444" stroke-width="2"/>
  <text x="830" y="253" class="mono" font-size="20" fill="#FAFAFA" font-weight="600" text-anchor="middle" letter-spacing="1">KAOS</text>
  <rect x="732.0" y="65.0" width="196" height="62" rx="14" fill="#1A1A1A" stroke="#262626"/>
  <text x="830.0" y="93.0" class="sans" font-size="18" fill="#FAFAFA" font-weight="600" text-anchor="middle">Brain</text>
  <text x="830.0" y="115.0" class="sans" font-size="14" fill="#A3A3A3" text-anchor="middle">thinks with Claude</text>
  <rect x="931.72" y="168.65" width="196" height="62" rx="14" fill="#1A1A1A" stroke="#262626"/>
  <text x="1029.72" y="196.65" class="sans" font-size="18" fill="#FAFAFA" font-weight="600" text-anchor="middle">Memory</text>
  <text x="1029.72" y="218.65" class="sans" font-size="14" fill="#A3A3A3" text-anchor="middle">one shared memory</text>
  <rect x="855.43" y="336.35" width="196" height="62" rx="14" fill="#1A1A1A" stroke="#262626"/>
  <text x="953.43" y="364.35" class="sans" font-size="18" fill="#FAFAFA" font-weight="600" text-anchor="middle">Hands</text>
  <text x="953.43" y="386.35" class="sans" font-size="14" fill="#A3A3A3" text-anchor="middle">runs jobs on a VPS</text>
  <rect x="608.57" y="336.35" width="196" height="62" rx="14" fill="#1A1A1A" stroke="#262626"/>
  <text x="706.57" y="364.35" class="sans" font-size="18" fill="#FAFAFA" font-weight="600" text-anchor="middle">Voice</text>
  <text x="706.57" y="386.35" class="sans" font-size="14" fill="#A3A3A3" text-anchor="middle">panel and WhatsApp</text>
  <rect x="532.28" y="168.65" width="196" height="62" rx="14" fill="#1A1A1A" stroke="#262626"/>
  <text x="630.28" y="196.65" class="sans" font-size="18" fill="#FAFAFA" font-weight="600" text-anchor="middle">World model</text>
  <text x="630.28" y="218.65" class="sans" font-size="14" fill="#A3A3A3" text-anchor="middle">of itself and the world</text>
</svg>
